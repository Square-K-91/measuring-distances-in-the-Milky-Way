<title>우리은하 성단 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: 화면 전체가 검은 하늘. 조작부는 모서리에만 얹고, 색은 두 가지 거리 측정법(따뜻한 색·차가운 색)에만 쓴다. */
:root{
  --bg:#05060a; --panel:rgba(13,16,24,.86); --panel-2:#121723;
  --line:#232a3a;
  --fg:#e9ebf1; --muted:#8e94a6; --dim:#5b6276;
  --warm:#ffb866; --cool:#8db8ff;
  --f-display:"Space Grotesk","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
body{font-family:var(--f-body);font-size:14px;line-height:1.5}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
#gl.hit{cursor:pointer}
#labels{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;color:var(--muted);opacity:0;transition:opacity .35s,color .2s;
  text-shadow:0 0 6px var(--bg),0 0 2px var(--bg);will-change:transform}
.lb.show{opacity:1}
.lb.p1{color:var(--fg)}
.lb.mark{font-family:var(--f-display);font-size:13px;color:var(--fg)}
.lb.ring{font-family:var(--f-mono);font-size:10.5px;color:var(--dim)}
.lb.act.open{color:var(--warm)} .lb.act.glob{color:var(--cool)}
#sel{position:fixed;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:1px solid var(--fg);opacity:0;pointer-events:none;transition:opacity .25s}
#sel.show{opacity:.8}
.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;gap:12px;
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ui button{pointer-events:auto!important}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:-.01em;margin:0}
.sub{font-size:12.5px;color:var(--muted)}
.toggles{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tg{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--fg);transition:color .2s,opacity .2s;backdrop-filter:blur(6px)}
.tg i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;transition:opacity .2s}
.tg.open i{background:var(--warm);box-shadow:0 0 8px var(--warm)}
.tg.glob i{background:var(--cool);box-shadow:0 0 8px var(--cool)}
.tg small{color:var(--muted);font-size:11.5px}
.tg[aria-pressed=false]{color:var(--dim)}
.tg[aria-pressed=false] i{opacity:.25;box-shadow:none}
.tg[aria-pressed=false] small{color:var(--dim)}
.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;
  min-width:210px;max-width:100%;backdrop-filter:blur(6px);opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;pointer-events:none}
.card.show{opacity:1;transform:none}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted)}
.eyebrow.open{color:var(--warm)} .eyebrow.glob{color:var(--cool)}
.nm{font-family:var(--f-display);font-size:17px;font-weight:600}
.nm small{font-family:var(--f-body);font-weight:400;font-size:12.5px;color:var(--muted);margin-left:6px}
.dist{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.dist span{font-family:var(--f-body);font-size:12.5px;color:var(--muted);margin-left:8px}
.meta{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.views{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:6px 13px;border-radius:999px;font-size:13px;color:var(--muted);transition:background .2s,color .2s;white-space:nowrap}
.seg button.on{background:var(--fg);color:var(--bg)}
.btn{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);transition:border-color .2s;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
button:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
#err{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);padding:24px;text-align:center}
@media (max-width:560px){h1{font-size:17px}.sub{display:none}.seg button{padding:6px 10px}.views{width:100%;justify-content:space-between}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<canvas id="gl" aria-label="우리은하 성단 3D 지도"></canvas>
<div id="labels" aria-hidden="true"></div>
<div id="sel"></div>
<div id="err" hidden>이 브라우저에서는 3D 그래픽(WebGL)을 사용할 수 없어요.</div>

<div class="ui">
  <header>
    <div>
      <h1>우리은하 성단 지도</h1>
      <span class="sub">태양에서 잰 성단까지의 거리</span>
    </div>
    <div class="toggles">
      <button class="tg open" id="tOpen" aria-pressed="true"><i></i>산개 성단 <small>주계열 맞추기</small></button>
      <button class="tg glob" id="tGlob" aria-pressed="true"><i></i>구상 성단 <small>변광성</small></button>
      <button class="tg" id="tDisk" aria-pressed="true"><i></i>은하 원반</button>
      <button class="tg" id="tLine" aria-pressed="true"><i></i>거리선</button>
    </div>
  </header>
  <div class="bottom">
    <div class="card" id="card" aria-live="polite">
      <span class="eyebrow" id="cKind"></span>
      <span class="nm" id="cName"></span>
      <span class="dist" id="cDist"></span>
      <span class="meta" id="cMeta"></span>
    </div>
    <div class="views">
      <button class="btn" id="replay">↻ 거리 재기</button>
      <div class="seg" id="views">
        <button data-v="sun">태양 근처</button>
        <button data-v="all" class="on">전체</button>
        <button data-v="top">위에서</button>
        <button data-v="side">옆에서</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s);
const cv=$('#gl');
if(!window.THREE){$('#err').hidden=false;return}
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true})}catch(e){$('#err').hidden=false;return}

/* ---------- 데이터: [이름, 별칭, 은경 l°, 은위 b°, 거리 kpc, 라벨 우선순위] ---------- */
const OPEN=[
['히아데스','',180.06,-22.34,0.047,1],['플레이아데스','M45',166.57,-23.52,0.136,1],['프레세페','M44',205.92,32.48,0.186,2],
['M7','',355.86,-4.50,0.28,3],['NGC 2516','',273.82,-15.86,0.41,3],['M25','세페이드 U Sgr 포함',13.70,-4.43,0.62,2],
['M41','',231.0,-10.4,0.71,3],['M35','',186.59,2.19,0.85,3],['M67','',215.70,31.90,0.86,1],
['NGC 6087','세페이드 S Nor 포함',327.73,-5.43,0.9,3],['M37','',177.64,3.09,1.4,3],['NGC 2244','장미 성운 성단',206.31,-2.07,1.5,3],
['M11','야생오리 성단',27.31,-2.78,1.9,2],['NGC 188','',122.84,22.38,1.9,2],['NGC 4755','보석상자 성단',303.21,2.50,2.0,2],
['NGC 7789','',115.53,-5.39,2.1,3],['이중 성단','h·χ Per',134.9,-3.7,2.3,1],['NGC 7790','세페이드 CF Cas 포함',116.59,-1.01,3.3,2],
['NGC 6791','',69.96,10.90,4.2,2]];
const GLOB=[
['M4','',350.97,15.97,2.2,1],['NGC 6397','',338.17,-11.96,2.3,2],['M22','',9.89,-7.55,3.2,1],['M71','',56.75,-4.56,4.0,3],
['NGC 6752','',336.49,-25.63,4.0,2],['M10','',15.14,23.08,4.4,3],['큰부리새자리 47','NGC 104',305.89,-44.89,4.5,1],
['M12','',15.72,26.31,4.8,3],['NGC 3201','',277.23,8.64,4.9,3],['오메가 센타우리','NGC 5139',309.10,14.97,5.2,1],
['M55','',8.79,-23.27,5.4,2],['M28','',7.80,-5.58,5.5,3],['NGC 6352','',341.42,-7.17,5.6,3],['NGC 4372','',300.99,-9.88,5.8,3],
['M107','',3.37,23.01,6.4,3],['NGC 4833','',303.60,-8.02,6.6,3],['M62','',353.57,7.32,6.8,3],['NGC 6712','',25.35,-4.32,6.9,3],
['M13','헤르쿨레스 구상 성단',59.01,40.91,7.1,1],['M5','',3.86,46.80,7.5,1],['NGC 6541','',349.29,-11.19,7.5,3],
['NGC 6362','',325.55,-17.57,7.6,3],['NGC 5927','',326.60,4.86,7.7,3],['M9','',5.54,10.71,7.9,3],['M30','',27.18,-46.84,8.1,2],
['M92','',68.34,34.86,8.3,2],['NGC 362','',301.53,-46.25,8.6,3],['NGC 6723','',0.07,-17.30,8.7,3],['M19','',356.87,9.38,8.8,3],
['M69','',1.72,-10.27,8.8,3],['NGC 288','',152.30,-89.38,8.9,2],['NGC 6144','',351.93,15.70,8.9,3],['M70','',2.85,-12.51,9.0,3],
['M14','',21.32,14.81,9.3,3],['M56','',62.66,8.34,9.4,3],['NGC 2808','',282.19,-11.25,9.6,2],['NGC 6388','',345.56,-6.74,9.9,3],
['M80','',352.67,19.46,10.0,2],['NGC 6652','',1.53,-11.38,10.0,3],['M3','',42.22,78.71,10.2,1],['M68','',299.63,36.05,10.3,2],
['M15','',65.01,-27.31,10.4,1],['NGC 5986','',337.02,13.27,10.4,3],['M2','',53.37,-35.77,11.5,2],['NGC 6441','',353.53,-5.01,11.6,3],
['NGC 1851','',244.51,-35.03,12.1,2],['NGC 5897','',342.95,30.29,12.5,3],['M79','',227.23,-29.35,12.9,2],['NGC 6584','',342.14,-16.41,13.5,3],
['NGC 6101','',317.74,-15.82,15.4,3],['NGC 6934','',52.10,-18.89,15.6,3],['NGC 5466','',42.15,73.59,16.0,3],['NGC 1261','',270.54,-52.12,16.3,3],
['M72','',35.16,-32.68,17.0,3],['NGC 5053','',335.70,78.95,17.4,3],['M53','',332.96,79.76,17.9,2],['M75','',20.30,-25.75,20.9,2],
['M54','',5.61,-14.09,26.5,1],['NGC 6229','',73.64,40.31,30.5,2]];

const R0=8.2,D2R=Math.PI/180,V3=THREE.Vector3;
const SUN=new V3(-R0,0,0),GC=new V3(0,0,0);
const COL={open:new THREE.Color(0xffb866),glob:new THREE.Color(0x8db8ff)};
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const gal=(l,b,d)=>{const cb=Math.cos(b*D2R);return new V3(d*cb*Math.cos(l*D2R)-R0,d*Math.sin(b*D2R),-d*cb*Math.sin(l*D2R))};

/* ---------- 장면 ---------- */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,1,0.05,3000);
renderer.setClearColor(0x05060a,1);
const TAN=2*Math.tan(22.5*D2R);
let W=1,H=1,DPR=1,fit=1;

let seed=20261115;
const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const gs=()=>(rnd()+rnd()+rnd()+rnd()-2)*1.732;

// 배경 별
{const n=1400,p=new Float32Array(n*3);
 for(let i=0;i<n;i++){const u=rnd()*2-1,a=rnd()*6.283,s=Math.sqrt(1-u*u),R=900;p[i*3]=R*s*Math.cos(a);p[i*3+1]=R*u;p[i*3+2]=R*s*Math.sin(a)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x8e94a6,size:1.3,sizeAttenuation:false,transparent:true,opacity:.55,depthWrite:false})))}

// 은하 원반 (양식화한 모습)
const diskMat=new THREE.ShaderMaterial({
  uniforms:{uScale:{value:1},uOp:{value:0},uMax:{value:9}},
  vertexShader:`attribute float size;attribute vec3 color;varying vec3 vC;uniform float uScale;uniform float uMax;
    void main(){vec4 mv=modelViewMatrix*vec4(position,1.);float ps=size*uScale/-mv.z;vC=color*min(1.,uMax*.45/ps);gl_PointSize=clamp(ps,1.2,uMax);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying vec3 vC;uniform float uOp;
    void main(){float d=length(gl_PointCoord-.5);float a=smoothstep(.5,0.,d);gl_FragColor=vec4(vC*a*uOp,1.);}`,
  blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false,transparent:true});
{const P=[],C=[],S=[];
 const put=(X,Y,Z,r,g,b,s)=>{P.push(X,Z,-Y);C.push(r,g,b);S.push(s)};
 const pitch=1/Math.tan(13*D2R);
 for(let i=0;i<30000;i++){ // 나선팔
   const k=i%4,r=Math.min(17.5,3.4-Math.log(1-rnd()*.985)*4.2);
   const a=k*Math.PI/2+.5+Math.log(r/3.4)*pitch,w=.38+r*.02,major=k%2===0?1:.6;
   const X=r*Math.cos(a)+gs()*w,Y=r*Math.sin(a)+gs()*w,br=(.25+rnd()*.55)*major,pk=rnd()<.06;
   put(X,Y,gs()*.12,(pk?1:.62)*br,(pk?.55:.76)*br,(pk?.7:1)*br,.1+rnd()*.16)}
 for(let i=0;i<14000;i++){ // 원반
   const r=Math.min(19,-Math.log(1-rnd()*.995)*3.6),a=rnd()*6.283,br=.12+rnd()*.2;
   put(r*Math.cos(a),r*Math.sin(a),gs()*.2,.95*br,.84*br,.7*br,.14+rnd()*.2)}
 const ux=-Math.cos(27*D2R),uy=Math.sin(27*D2R);
 for(let i=0;i<6000;i++){ // 막대와 팽대부
   const x=gs()*1.7,y=gs()*.7,br=.08+rnd()*.14;
   put(x*ux-y*uy,x*uy+y*ux,gs()*.5,br,.8*br,.56*br,.14+rnd()*.2)}
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
 g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));
 g.setAttribute('size',new THREE.Float32BufferAttribute(S,1));
 const pts=new THREE.Points(g,diskMat);pts.frustumCulled=false;pts.renderOrder=0;scene.add(pts)}

// 은하면 눈금 원
const RINGS=[5,10,15,20];
for(const R of RINGS){const p=[];for(let i=0;i<=160;i++){const a=i/160*6.2832;p.push(R*Math.cos(a),0,R*Math.sin(a))}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
  scene.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:0x232a3a,transparent:true,opacity:.9,depthWrite:false})))}
{const g=new THREE.BufferGeometry().setFromPoints([SUN,GC]);const l=new THREE.Line(g,new THREE.LineDashedMaterial({color:0x5b6276,dashSize:.25,gapSize:.25,transparent:true,depthWrite:false}));l.computeLineDistances();scene.add(l)}

// 빛나는 점
const glow=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.14,'rgba(255,255,255,1)');g.addColorStop(.36,'rgba(255,255,255,.28)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
const mkSprite=(color,px)=>{const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glow,color,transparent:true,depthTest:false,depthWrite:false,sizeAttenuation:false,blending:THREE.AdditiveBlending}));
  s.userData.px=px;s.renderOrder=3;scene.add(s);return s};
const sunS=mkSprite(0xffffff,26);sunS.position.copy(SUN);
const gcS=mkSprite(0x8e94a6,14);gcS.position.copy(GC);

// 성단
const CL=[];
const add=(rows,kind)=>rows.forEach(([name,alias,l,b,d,pri])=>{
  const pos=gal(l,b,d);CL.push({name,alias,l,b,d,pri,kind,pos,cur:SUN.clone(),p:0,a:0,vis:1,sp:mkSprite(COL[kind],kind==='open'?17:21),rgc:pos.length()})});
add(OPEN,'open');add(GLOB,'glob');
CL.sort((a,b)=>a.d-b.d);
const N=CL.length,T_END=7.6;
CL.forEach((c,i)=>c.t0=.7+5.2*Math.pow(i/(N-1),.85));

// 거리선(태양→성단)과 은하면까지의 수선
const mkLines=()=>{const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(N*6),3));g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(N*6),3));
  const l=new THREE.LineSegments(g,new THREE.LineBasicMaterial({vertexColors:true,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,depthTest:false}));
  l.frustumCulled=false;l.renderOrder=1;scene.add(l);return g};
const sightG=mkLines(),dropG=mkLines();
const hiG=new THREE.BufferGeometry().setFromPoints([SUN,SUN]);
const hiL=new THREE.Line(hiG,new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthTest:false,depthWrite:false}));
hiL.frustumCulled=false;hiL.renderOrder=2;scene.add(hiL);

/* ---------- 라벨 ---------- */
const LB=[],box=$('#labels');
const mkLabel=(text,cls,pos,o)=>{const el=document.createElement('div');el.className='lb '+cls;el.textContent=text;box.appendChild(el);
  const L=Object.assign({el,pos,dx:11,w:60,on:false,ok:()=>true},o);LB.push(L);return L};
mkLabel('태양','mark',SUN,{rank:0,dx:14});
mkLabel('은하 중심','mark',GC,{rank:0});
for(const c of CL)c.lb=mkLabel(c.name,c.kind+' p'+c.pri,c.cur,{rank:c.pri,ok:()=>c.a>.5,c});
mkLabel(R0+' kpc','ring',new V3(-R0/2,0,0),{rank:4,dx:6});
for(const R of RINGS)mkLabel(R+' kpc','ring',new V3(R*Math.cos(2.2),0,R*Math.sin(2.2)),{rank:5,dx:6});
LB.sort((a,b)=>a.rank-b.rank);
const measure=()=>{for(const L of LB)L.w=L.el.offsetWidth};

/* ---------- 카메라 ---------- */
const cam={t:SUN.clone(),r:4,th:2.0,ph:1.05},goal={t:SUN.clone(),r:4,th:2.0,ph:1.05};
const VIEWS={sun:{t:SUN,r:6.5,ph:1.05},all:{t:GC,r:56,ph:1.08},top:{t:GC,r:62,ph:.02,th:Math.PI/2},side:{t:GC,r:56,ph:Math.PI/2-.02,th:Math.PI/2}};
let auto=!reduce,choreo=true,camK=1.6;
const setView=k=>{const v=VIEWS[k];goal.t.copy(v.t);goal.r=v.r*fit;goal.ph=v.ph;
  if(v.th!=null){let d=(v.th-cam.th)%(2*Math.PI);if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;goal.th=cam.th+d}
  camK=3;choreo=false;auto=!reduce&&(k==='all'||k==='sun');
  document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.v===k))};
const freeView=()=>{auto=false;choreo=false;camK=7;document.querySelectorAll('#views button').forEach(b=>b.classList.remove('on'))};
$('#views').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v)});

/* ---------- 조작 ---------- */
const S={open:true,glob:true,disk:true,line:true,hover:null,sel:null};
const tog=(id,key)=>{$(id).onclick=()=>{S[key]=!S[key];$(id).setAttribute('aria-pressed',S[key]);
  if(S.sel&&!S[S.sel.kind])S.sel=null;showCard()}};
tog('#tOpen','open');tog('#tGlob','glob');tog('#tDisk','disk');tog('#tLine','line');

const ptr=new Map();let moved=0,pinch=0;
const pick=(x,y,rad)=>{let best=null,bd=rad*rad;for(const c of CL){if(c.a<.5)continue;const dx=c.sx-x,dy=c.sy-y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=c}}return best};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;
  if(ptr.size===2){const[a,b]=[...ptr.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y)}});
cv.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);
  if(!p){if(e.pointerType==='mouse'){S.hover=pick(e.clientX,e.clientY,16);cv.classList.toggle('hit',!!S.hover);showCard()}return}
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  if(moved<5)return;
  if(ptr.size===1){freeView();cv.classList.add('drag');goal.th+=dx*.006;goal.ph=Math.min(Math.PI-.02,Math.max(.02,goal.ph-dy*.006))}
  else if(ptr.size===2){const[a,b]=[...ptr.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch>0){freeView();goal.r=Math.min(220,Math.max(1,goal.r*pinch/d))}pinch=d}});
const up=e=>{if(!ptr.has(e.pointerId))return;ptr.delete(e.pointerId);cv.classList.remove('drag');pinch=0;
  if(moved<5&&e.type==='pointerup'){S.sel=pick(e.clientX,e.clientY,24);if(e.pointerType!=='mouse')S.hover=null;showCard()}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',()=>{S.hover=null;cv.classList.remove('hit');showCard()});
cv.addEventListener('wheel',e=>{e.preventDefault();freeView();goal.r=Math.min(220,Math.max(1,goal.r*Math.exp(e.deltaY*.0012)))},{passive:false});

const fD=d=>d<1?Math.round(d*1000)+' pc':d.toFixed(1)+' kpc';
const fLy=d=>{const ly=d*3261.6,m=Math.pow(10,Math.floor(Math.log10(ly))-1);return (Math.round(ly/m)*m).toLocaleString('ko-KR')};
let shown=null;
function showCard(){const c=S.hover||S.sel;$('#card').classList.toggle('show',!!c);if(!c||c===shown)return;shown=c;
  const k=$('#cKind');k.className='eyebrow '+c.kind;k.textContent=c.kind==='open'?'산개 성단 · 주계열 맞추기':'구상 성단 · 변광성';
  const n=$('#cName');n.textContent=c.name;if(c.alias){const s=document.createElement('small');s.textContent=c.alias;n.appendChild(s)}
  const d=$('#cDist');d.textContent=fD(c.d);const s=document.createElement('span');s.textContent='약 '+fLy(c.d)+'광년';d.appendChild(s);
  $('#cMeta').textContent=`l ${c.l.toFixed(1)}° · b ${c.b>0?'+':''}${c.b.toFixed(1)}° · 은하 중심에서 ${c.rgc.toFixed(1)} kpc`}

let T=reduce?T_END+3:0;
$('#replay').onclick=()=>{T=0;S.sel=S.hover=null;showCard();diskSm=0;lineSm=1;
  cam.t.copy(SUN);cam.r=4;cam.ph=1.05;goal.t.copy(SUN);goal.r=4;goal.ph=1.05;goal.th=cam.th;choreo=true;auto=!reduce;camK=1.6;
  document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.v==='all'));
  if(reduce){T=T_END+3;setView('all')}};

/* ---------- 프레임 ---------- */
function resize(){W=cv.clientWidth;H=cv.clientHeight;DPR=Math.min(devicePixelRatio||1,2);renderer.setPixelRatio(DPR);renderer.setSize(W,H,false);
  camera.aspect=W/H;camera.updateProjectionMatrix();diskMat.uniforms.uScale.value=H*DPR/TAN;diskMat.uniforms.uMax.value=9*DPR;fit=Math.max(1,.8*H/W);measure()}
addEventListener('resize',resize);resize();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(measure);
if(reduce)setView('all');

const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3),sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const v=new V3(),placed=[];let diskSm=0,lineSm=1,hiSm=0,last=performance.now();
const selEl=$('#sel');

function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  const k=x=>1-Math.exp(-dt*x);

  // 성단: 태양에서 측정한 거리만큼 뻗어 나간다
  let reach=0;const sp=sightG.attributes.position.array,sc=sightG.attributes.color.array,dp=dropG.attributes.position.array,dc=dropG.attributes.color.array;
  const intro=T<T_END;
  lineSm+=((S.line?(intro?.42:.11):0)-lineSm)*k(intro?6:1.5);
  const act=S.hover||S.sel;
  CL.forEach((c,i)=>{
    c.p=ease((T-c.t0)/1.3);c.vis+=((S[c.kind]?1:0)-c.vis)*k(7);
    c.cur.copy(SUN).lerp(c.pos,c.p);c.a=Math.min(1,c.p*5)*c.vis;
    if(c.p>0)reach=Math.max(reach,c.d*c.p);
    const pulse=c.p<1&&c.p>0?1.5:1,px=c.sp.userData.px*(c===act?1.6:pulse)*TAN/H;
    c.sp.position.copy(c.cur);c.sp.scale.setScalar(px);c.sp.material.opacity=c.a;
    const col=COL[c.kind],o=i*6,la=c.a*lineSm*(c.p<1?1.6:1),da=c.a*.16;
    sp[o]=SUN.x;sp[o+1]=SUN.y;sp[o+2]=SUN.z;sp[o+3]=c.cur.x;sp[o+4]=c.cur.y;sp[o+5]=c.cur.z;
    dp[o]=c.cur.x;dp[o+1]=c.cur.y;dp[o+2]=c.cur.z;dp[o+3]=c.cur.x;dp[o+4]=0;dp[o+5]=c.cur.z;
    for(let j=0;j<2;j++){const q=o+j*3;sc[q]=col.r*la;sc[q+1]=col.g*la;sc[q+2]=col.b*la;dc[q]=col.r*da;dc[q+1]=col.g*da;dc[q+2]=col.b*da}});
  sightG.attributes.position.needsUpdate=sightG.attributes.color.needsUpdate=dropG.attributes.position.needsUpdate=dropG.attributes.color.needsUpdate=true;

  // 선택한 성단까지의 거리선
  hiSm+=((act?1:0)-hiSm)*k(8);
  if(act){const h=hiG.attributes.position.array;h[3]=act.cur.x;h[4]=act.cur.y;h[5]=act.cur.z;hiG.attributes.position.needsUpdate=true;hiL.material.color.copy(COL[act.kind])}
  hiL.material.opacity=hiSm*.9;

  diskSm+=((S.disk&&T>T_END-1.6?1:0)-diskSm)*k(1.1);diskMat.uniforms.uOp.value=diskSm*.3;
  sunS.scale.setScalar(sunS.userData.px*TAN/H);gcS.scale.setScalar(gcS.userData.px*TAN/H);gcS.material.opacity=.9-diskSm*.6;

  // 카메라
  if(choreo){goal.r=Math.min(56,Math.max(4,reach*2.7))*fit;goal.t.copy(SUN).lerp(GC,sm(1.5,13,reach));goal.ph=1.05+.03*sm(1.5,13,reach)}
  if(auto&&!ptr.size)goal.th+=dt*(choreo&&intro?.11:.035);
  const kc=k(camK);cam.t.lerp(goal.t,kc);cam.r+=(goal.r-cam.r)*kc;cam.th+=(goal.th-cam.th)*kc;cam.ph+=(goal.ph-cam.ph)*kc;
  const s=Math.sin(cam.ph);
  camera.position.set(cam.t.x+cam.r*s*Math.cos(cam.th),cam.t.y+cam.r*Math.cos(cam.ph),cam.t.z+cam.r*s*Math.sin(cam.th));
  camera.lookAt(cam.t);camera.updateMatrixWorld();
  renderer.render(scene,camera);

  // 라벨 배치: 우선순위 순서로 놓고 겹치면 숨긴다
  placed.length=0;
  const place=L=>{v.copy(L.pos).project(camera);const x=(v.x*.5+.5)*W,y=(-v.y*.5+.5)*H;if(L.c){L.c.sx=x;L.c.sy=y}
    let show=L.ok()&&v.z<1&&x>-20&&x<W&&y>0&&y<H;
    if(show){const a=x+L.dx-3,b=y-9,c=a+L.w+6,d=y+9;for(const r of placed)if(a<r[2]&&c>r[0]&&b<r[3]&&d>r[1]){show=false;break}if(show)placed.push([a,b,c,d])}
    L.el.style.transform=`translate3d(${(x+L.dx).toFixed(1)}px,${y.toFixed(1)}px,0) translateY(-50%)`;
    if(show!==L.on){L.on=show;L.el.classList.toggle('show',show)}
    const isAct=!!L.c&&L.c===act;if(isAct!==L.act){L.act=isAct;L.el.classList.toggle('act',isAct)}};
  if(act)place(act.lb);
  for(const L of LB)if(!act||L!==act.lb)place(L);
  if(S.sel&&S.sel.a>.5){selEl.style.transform=`translate3d(${S.sel.sx.toFixed(1)}px,${S.sel.sy.toFixed(1)}px,0)`;selEl.classList.add('show')}else selEl.classList.remove('show');

  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
